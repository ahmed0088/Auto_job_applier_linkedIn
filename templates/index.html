<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Auto Job Applier - Applied Jobs History</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236d6bf5'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M17.5 6 9 18h5.5L14 26l8.5-12H17L17.5 6Z' fill='white'/%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #f3f4f9;
            --bg-soft: #eceef5;
            --card: #ffffff;
            --ink: #171a2b;
            --muted: #666e83;
            --line: #e2e5ee;
            --brand: #5457e0;
            --brand2: #06b6d4;
            --brand-dark: #4345c4;
            --ok: #17a06a;
            --danger: #dc2626;
            --thead-bg: #f2f3f9;
            --row-alt: #f9fafc;
            --shadow: 0 1px 2px rgba(23,26,43,.05), 0 6px 16px -6px rgba(23,26,43,.10);
            --radius: 14px;
            color-scheme: light;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #090b12;
                --bg-soft: #0d0f18;
                --card: #12141f;
                --ink: #eaecf5;
                --muted: #8b90a6;
                --line: #232636;
                --brand: #7b7ef7;
                --brand2: #29e0f2;
                --brand-dark: #9497fb;
                --ok: #33d693;
                --danger: #ff6b6b;
                --thead-bg: #171a27;
                --row-alt: #0f111b;
                --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px -6px rgba(0,0,0,.5);
                color-scheme: dark;
            }
        }
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; overflow-x: hidden; }
        body {
            margin: 0;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background:
                radial-gradient(1100px 480px at 50% -180px, color-mix(in srgb, var(--brand) 10%, transparent), transparent),
                var(--bg);
            color: var(--ink);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        header {
            background: color-mix(in srgb, var(--card) 88%, transparent);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
            padding: 18px 24px;
        }
        .brandrow { display: flex; align-items: center; gap: 12px; }
        .brandmark {
            width: 38px; height: 38px; border-radius: 11px; flex: none;
            background: linear-gradient(135deg, var(--brand), var(--brand2));
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow);
        }
        .brandmark svg { width: 20px; height: 20px; }
        header h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
        header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
        .wrap { width: 100%; max-width: 1100px; margin: 0 auto; padding: 0 16px; }
        main.wrap { padding: 24px 16px 40px; }
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 16px;
        }
        .table-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        table.history {
            border-collapse: collapse;
            width: 100%;
            min-width: 720px;
            font-size: 13.5px;
        }
        table.history th, table.history td {
            border-bottom: 1px solid var(--line);
            padding: 10px 12px;
            text-align: left;
            vertical-align: top;
            white-space: nowrap;
        }
        table.history td.wraps { white-space: normal; }
        table.history th {
            background: var(--thead-bg);
            font-weight: 700;
            font-size: 11.5px;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: var(--muted);
            user-select: none;
        }
        table.history tbody tr:hover { background: var(--row-alt); }
        table.history a { color: var(--brand); text-decoration: none; font-weight: 600; }
        table.history a:hover { text-decoration: underline; }
        .sort-toggle {
            background: none;
            border: none;
            font: inherit;
            font-weight: 600;
            color: inherit;
            cursor: pointer;
            padding: 0;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .sort-toggle:hover { color: var(--brand); }
        .sort-toggle .arrow { font-size: 11px; color: var(--muted); }
        .sort-toggle:hover .arrow { color: var(--brand); }
        .tick {
            color: var(--ok);
            font-weight: 700;
        }
        .center { text-align: center; }
        .placeholder-row td {
            white-space: normal;
            text-align: center;
            color: var(--muted);
            padding: 28px 12px;
        }
        .placeholder-row.error td { color: var(--danger); }
        .hint {
            margin: 10px 2px 0;
            color: var(--muted);
            font-size: 12.5px;
        }

        @media (max-width: 640px) {
            header { padding: 16px 16px; }
            header h1 { font-size: 18px; }
            .wrap { padding: 0 12px; }
            main.wrap { padding: 18px 12px 32px; }
            .card { padding: 12px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="wrap brandrow">
            <div class="brandmark">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>
            </div>
            <div>
                <h1>Applied Jobs History</h1>
                <p>Every job the bot has applied to (or queued for you to apply to), in one place.</p>
            </div>
        </div>
    </header>

    <main class="wrap">
        <div class="card">
            <div class="table-scroll">
                <table class="history">
                    <thead>
                        <tr>
                            <th class="center" style="width:44px;">#</th>
                            <th>Job Title</th>
                            <th>Company</th>
                            <th>HR Contact</th>
                            <th>
                                <button type="button" class="sort-toggle" id="appSortBtn" aria-label="Sort by Application">
                                    Application <span class="arrow" id="appSortArrow">&#8645;</span>
                                </button>
                            </th>
                            <th class="center">Applied</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody">
                        <tr class="placeholder-row"><td colspan="6">Loading applied jobs...</td></tr>
                    </tbody>
                </table>
            </div>
            <p class="hint" id="rowCountHint"></p>
        </div>
    </main>

    <script>
        (function () {
            'use strict';

            var jobs = [];               // raw data from the server
            var sortDirection = null;    // null = server order, 'asc' or 'desc' once toggled
            var tbody = document.getElementById('historyBody');
            var sortBtn = document.getElementById('appSortBtn');
            var sortArrow = document.getElementById('appSortArrow');
            var rowCountHint = document.getElementById('rowCountHint');

            function makeCell(tag, opts) {
                var node = document.createElement(tag);
                opts = opts || {};
                if (opts.className) node.className = opts.className;
                if (opts.text !== undefined) node.textContent = opts.text;
                if (opts.center) node.classList.add('center');
                return node;
            }

            function makeLink(href, label, extraClass) {
                var a = document.createElement('a');
                a.href = href;
                a.target = '_blank';
                a.rel = 'noopener';
                a.textContent = label;
                if (extraClass) a.className = extraClass;
                return a;
            }

            function hasHrContact(job) {
                return !!(job.HR_Name && job.HR_Name !== 'Unknown');
            }

            // 0 = Easy Applied, 1 = external link available, 2 = nothing to show
            function applicationRank(job) {
                if (job.External_Job_link === 'Easy Applied') return 0;
                if (job.External_Job_link) return 1;
                return 2;
            }

            function isAppliedAlready(job) {
                return !!(job.Date_Applied && job.Date_Applied !== 'Pending');
            }

            function buildAppliedCell(job) {
                var td = makeCell('td', { center: true });
                if (isAppliedAlready(job)) {
                    var span = document.createElement('span');
                    span.className = 'tick';
                    span.setAttribute('aria-label', 'Applied');
                    span.textContent = '✓';
                    td.appendChild(span);
                }
                return td;
            }

            function markRowApplied(jobId) {
                var row = tbody.querySelector('tr[data-job-id="' + CSS.escape(String(jobId)) + '"]');
                var record = jobs.filter(function (j) { return String(j.Job_ID) === String(jobId); })[0];
                if (record) record.Date_Applied = new Date().toISOString();
                if (!row) return;
                var appliedCell = row.querySelector('.applied-cell');
                if (!appliedCell) return;
                appliedCell.innerHTML = '';
                var span = document.createElement('span');
                span.className = 'tick';
                span.setAttribute('aria-label', 'Applied');
                span.textContent = '✓';
                appliedCell.appendChild(span);
            }

            function buildApplicationCell(job) {
                var td = document.createElement('td');
                if (job.External_Job_link === 'Easy Applied') {
                    td.textContent = 'Easy Applied';
                    return td;
                }
                if (job.External_Job_link) {
                    var link = makeLink(job.External_Job_link, 'External link');
                    link.addEventListener('click', function () {
                        fetch('/applied-jobs/' + encodeURIComponent(job.Job_ID), { method: 'PUT' })
                            .then(function (resp) {
                                if (resp.ok) markRowApplied(job.Job_ID);
                            })
                            .catch(function (err) {
                                console.error('Could not mark job as applied:', err);
                            });
                    });
                    td.appendChild(link);
                    return td;
                }
                td.textContent = 'N/A';
                return td;
            }

            function buildRow(job, rowNumber) {
                var tr = document.createElement('tr');
                tr.setAttribute('data-job-id', job.Job_ID);

                tr.appendChild(makeCell('td', { center: true, text: String(rowNumber) }));

                var titleCell = document.createElement('td');
                titleCell.classList.add('wraps');
                if (job.Job_Link) {
                    titleCell.appendChild(makeLink(job.Job_Link, job.Title || '(untitled)'));
                } else {
                    titleCell.textContent = job.Title || '(untitled)';
                }
                tr.appendChild(titleCell);

                var companyCell = makeCell('td', { text: job.Company || '' });
                companyCell.classList.add('wraps');
                tr.appendChild(companyCell);

                var hrCell = document.createElement('td');
                if (hasHrContact(job) && job.HR_Link) {
                    hrCell.appendChild(makeLink(job.HR_Link, job.HR_Name));
                } else if (hasHrContact(job)) {
                    hrCell.textContent = job.HR_Name;
                } else {
                    hrCell.textContent = 'N/A';
                }
                tr.appendChild(hrCell);

                tr.appendChild(buildApplicationCell(job));

                var appliedCell = buildAppliedCell(job);
                appliedCell.classList.add('applied-cell');
                tr.appendChild(appliedCell);

                return tr;
            }

            function currentOrder() {
                if (!sortDirection) return jobs.slice();
                var withIndex = jobs.map(function (job, i) { return { job: job, i: i }; });
                withIndex.sort(function (a, b) {
                    var ra = applicationRank(a.job), rb = applicationRank(b.job);
                    if (ra !== rb) return sortDirection === 'asc' ? ra - rb : rb - ra;
                    return a.i - b.i;
                });
                return withIndex.map(function (entry) { return entry.job; });
            }

            function showPlaceholder(message, isError) {
                tbody.innerHTML = '';
                var tr = document.createElement('tr');
                tr.className = 'placeholder-row' + (isError ? ' error' : '');
                var td = document.createElement('td');
                td.colSpan = 6;
                td.textContent = message;
                tr.appendChild(td);
                tbody.appendChild(tr);
                rowCountHint.textContent = '';
            }

            function render() {
                if (!jobs.length) {
                    showPlaceholder('No applied jobs yet. Run the bot to start building your history.', false);
                    return;
                }
                tbody.innerHTML = '';
                var ordered = currentOrder();
                ordered.forEach(function (job, idx) {
                    tbody.appendChild(buildRow(job, idx + 1));
                });
                rowCountHint.textContent = ordered.length + (ordered.length === 1 ? ' job.' : ' jobs.');
            }

            function toggleSort() {
                if (sortDirection === 'asc') {
                    sortDirection = 'desc';
                    sortArrow.textContent = '↓';
                } else {
                    sortDirection = 'asc';
                    sortArrow.textContent = '↑';
                }
                render();
            }

            sortBtn.addEventListener('click', toggleSort);

            fetch('/applied-jobs')
                .then(function (resp) {
                    if (!resp.ok) throw new Error('Server responded with ' + resp.status);
                    return resp.json();
                })
                .then(function (data) {
                    jobs = Array.isArray(data) ? data : [];
                    render();
                })
                .catch(function (err) {
                    console.error('Failed to load applied jobs:', err);
                    showPlaceholder('Could not load applied jobs. Make sure the app is running and try refreshing this page.', true);
                });
        })();
    </script>
</body>
</html>
